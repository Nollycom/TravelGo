name: Deploy to Firebase Hosting (travgo.web.app)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk 2>/dev/null || cp public/app-debug.apk out/app-debug.apk 2>/dev/null || echo "apk not found, skipping copy"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRAVGORAVEL }}
          projectId: travgoravel
          channelId: live
          target: travgo
